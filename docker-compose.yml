services:
  # 1. MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: oryenza-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-oryenza_secure_pass_2026}
      MYSQL_DATABASE: oryenza_talent_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Node.js Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oryenza-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-oryenza_secure_pass_2026}
      DB_NAME: oryenza_talent_db
      DB_PORT: 3306
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-OryenzaTalentServices@132026}
    volumes:
      - resume_uploads:/app/uploads/resumes
      - local_data:/app/data
    ports:
      - "5000:5000"

  # 3. React Vite Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oryenza-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
  resume_uploads:
  local_data:

