<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oryenza 5-Stage Recruitment Journey Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: transparent;
  --plate: #ffffff;
  --card-bg: #ffffff;
  --card-border: #bfe3ff;
  --text: #0b1f3a;
  --num: #1565d8;
  --track: #dce6f3;
  --glow: #27b5ff;
  --beam: #1f6bff;
  --pulse: #2bd8ff;
  --runner-border: #8fd6ff;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plate: #10233c;
    --card-bg: #10233c;
    --card-border: #294a73;
    --text: #f4f8ff;
    --num: #38bdf8;
    --track: #1e3a5f;
    --glow: #38bdf8;
    --beam: #1565d8;
    --pulse: #38bdf8;
    --runner-border: #38bdf8;
  }
}

:root[data-theme="dark"], html.oryenza-dark {
  --plate: #10233c;
  --card-bg: #10233c;
  --card-border: #294a73;
  --text: #f4f8ff;
  --num: #38bdf8;
  --track: #1e3a5f;
  --glow: #38bdf8;
  --beam: #1565d8;
  --pulse: #38bdf8;
  --runner-border: #38bdf8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}

#wrap {
  width: 100%;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
  position: relative;
  transition: opacity 0.3s ease;
}

svg {
  width: min(92vw, 520px);
  height: auto;
  overflow: visible;
  display: block;
}

#lab {
  text-align: center;
  margin-top: 14px;
  min-height: 80px;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
}

#num {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: clamp(34px, 5.5vw, 44px);
  color: var(--num);
  line-height: 1.1;
  letter-spacing: -0.02em;
}

#name {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: clamp(22px, 3.8vw, 28px);
  color: var(--text);
  letter-spacing: -0.01em;
}
</style>
</head>
<body>
<div id="wrap">
  <svg viewBox="-170 -150 1040 1000" role="img" aria-label="5 Stage Recruitment Process Journey Animation">
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="120" x2="660" y2="640">
        <stop offset="0" stop-color="#2BD8FF"/>
        <stop offset=".55" stop-color="#1F6BFF"/>
        <stop offset="1" stop-color="#0A2A78"/>
      </linearGradient>
      <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>
      <mask id="c" maskUnits="userSpaceOnUse" x="-90" y="-90" width="880" height="880">
        <rect x="-90" y="-90" width="880" height="880" fill="#fff"/>
        <polygon points="350,351 744,43 665,-38 569,-98" fill="#000"/>
      </mask>
      <mask id="m" maskUnits="userSpaceOnUse" x="-90" y="-90" width="880" height="880">
        <circle id="mc" cx="350" cy="351" r="0" fill="#fff"/>
      </mask>
    </defs>

    {/* Track & Circular Progress */}
    <g mask="url(#c)">
      <circle cx="350" cy="351" r="280" fill="none" stroke="var(--track)" stroke-width="82"/>
      <g transform="rotate(-38 350 351)">
        <circle id="gl" cx="350" cy="351" r="280" fill="none" stroke="var(--glow)" stroke-width="82" pathLength="100" stroke-dasharray="0 100" filter="url(#b)" opacity=".55"/>
        <circle id="pr" cx="350" cy="351" r="280" fill="none" stroke="url(#g)" stroke-width="82" pathLength="100" stroke-dasharray="0 100"/>
      </g>
    </g>

    {/* Lead-in Arrow */}
    <g id="ar" opacity=".2">
      <path d="M395 305L565 107" stroke="url(#g)" stroke-width="40" fill="none"/>
      <polygon points="640,32 606,140 532,66" fill="url(#g)"/>
    </g>

    {/* Central Logo Plate & Masked Brand Symbol */}
    <circle id="pl" cx="350" cy="351" r="238" fill="var(--plate)" opacity="0"/>
    <g id="tk" mask="url(#m)">
      <image href="/assets/process_journey_logo.png" x="0" y="0" width="700" height="700"/>
    </g>

    {/* Pulse Wave Shockwave */}
    <circle id="pu" cx="350" cy="351" r="280" fill="none" stroke="var(--pulse)" stroke-width="6" opacity="0"/>

    {/* Traveling Head / Runner & Speech Bubble */}
    <g id="hd" opacity="0">
      <rect x="612" y="315" width="36" height="72" rx="18" fill="var(--plate)" stroke="var(--runner-border)" stroke-width="4"/>
      <rect x="618" y="358" width="24" height="22" rx="8" fill="var(--beam)" opacity=".85"/>
      <g id="bd" opacity="0">
        <path d="M545 221h310a12 12 0 0 1 12 12v40a12 12 0 0 1-12 12H714l-14 16-14-16H545a12 12 0 0 1-12-12v-40a12 12 0 0 1 12-12z" transform="translate(-12 -4)" fill="var(--card-bg)" stroke="var(--card-border)" stroke-width="4"/>
        <text id="pt" x="700" y="264" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="27" fill="var(--text)">01  Requirement</text>
        <circle cx="700" cy="351" r="44" fill="var(--plate)" stroke="var(--card-border)" stroke-width="5"/>
        <g id="ic0" opacity="0" transform="translate(673.6 324.6) scale(2.2)" fill="none" stroke="var(--num)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14H7z M14 3v4h4 M9.5 12h6 M9.5 15.5h6 M9.5 9h2"/>
        </g>
        <g id="ic1" opacity="0" transform="translate(673.6 324.6) scale(2.2)" fill="none" stroke="var(--num)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6"/>
          <path d="M16 16l5 5"/>
        </g>
        <g id="ic2" opacity="0" transform="translate(673.6 324.6) scale(2.2)" fill="none" stroke="var(--num)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="5" width="12" height="16" rx="2"/>
          <path d="M9 5V4h6v1 M9 13l2 2 4-4"/>
        </g>
        <g id="ic3" opacity="0" transform="translate(673.6 324.6) scale(2.2)" fill="none" stroke="var(--num)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4.5 21c0-4.5 3.5-7 7.5-7s7.5 2.5 7.5 7"/>
        </g>
        <g id="ic4" opacity="0" transform="translate(673.6 324.6) scale(2.2)" fill="none" stroke="var(--num)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14H7z M14 3v4h4 M9.5 11h5 M10 17l2 2 4-4"/>
        </g>
      </g>
    </g>
  </svg>
  <div id="lab">
    <div id="num">06</div>
    <div id="name">Successful Joining</div>
  </div>
</div>

<script>
// Live theme synchronization with parent document
function syncTheme() {
  try {
    const parentDoc = window.parent && window.parent.document ? window.parent.document.documentElement : null;
    const parentIsDark = parentDoc && (parentDoc.classList.contains('oryenza-dark') || parentDoc.getAttribute('data-theme') === 'dark');
    const local = localStorage.getItem('oryenza_theme');
    const isDark = parentIsDark || (local === 'dark') || (!local && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.classList.add('oryenza-dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.remove('oryenza-dark');
    }
  } catch (e) {}
}
syncTheme();
try {
  if (window.parent && window.parent.document) {
    const observer = new MutationObserver(syncTheme);
    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
  }
} catch (e) {}
window.addEventListener('storage', syncTheme);

// 5-Stage Animation Engine
const POP = ["01  Requirement Intake", "02  Active Sourcing", "03  Contextual Screening", "04  Interview Loop", "05  Offer & Onboarding"];
const CX = 350, CY = 351, MAXA = 334;
const L = [0.4, 3.1, 5.7, 8.3, 10.9, 13.5], DP = [1.2, 3.8, 6.4, 9, 11.6], T = 1.9, TR = 13.7, TD = 1.3, END = TR + TD + 3.5, FADE = 0.8;
const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const cl = x => Math.max(0, Math.min(1, x));
const $ = id => document.getElementById(id);

function frame(t) {
  const tt = Math.min(t, END);
  let p = 0;
  for (let j = 0; j < 5; j++) {
    if (tt >= DP[j]) p = (j + ease(cl((tt - DP[j]) / T))) / 5;
  }
  const da = `${p * MAXA / 3.6} 100`;
  $('pr').setAttribute('stroke-dasharray', da);
  $('gl').setAttribute('stroke-dasharray', da);

  const th = -38 + p * MAXA;
  $('hd').setAttribute('transform', `rotate(${th} ${CX} ${CY})`);
  $('hd').setAttribute('opacity', cl((tt - 0.2) / 0.3) * (1 - cl((tt - TR) / 0.6)));
  $('bd').setAttribute('transform', `rotate(${-th} 700 ${CY})`);

  let bo = 0, idx = 0;
  for (let j = 0; j < 5; j++) {
    const w = cl((tt - L[j]) / 0.25) * (1 - cl((tt - L[j + 1] + 0.25) / 0.25));
    $('ic' + j).setAttribute('opacity', w);
    bo = Math.max(bo, w);
    if (tt >= L[j]) idx = j;
  }
  $('pt').textContent = POP[idx];
  $('bd').setAttribute('opacity', bo);

  const lo = cl((tt - L[5] - 0.2) / 0.5);
  $('lab').style.opacity = lo;
  $('lab').style.transform = `translateY(${(1 - lo) * 10}px)`;

  const v = cl((tt - TR) / TD), ve = ease(v);
  $('ar').setAttribute('opacity', 0.2 * (1 - cl((tt - TR) / 0.5)));
  $('mc').setAttribute('r', ve * 500);
  $('pl').setAttribute('opacity', cl(v * 2));
  $('tk').setAttribute('transform', `translate(${CX} ${CY}) scale(${0.9 + 0.1 * ve}) translate(${-CX} ${-CY})`);
  $('pu').setAttribute('r', 280 + ve * 70);
  $('pu').setAttribute('opacity', v > 0 ? (1 - ve) * 0.8 : 0);

  $('wrap').style.opacity = Math.min(cl(t / 0.4), cl((END + FADE - t) / FADE));
}

let clock = 0, last = null;
document.addEventListener('visibilitychange', () => { last = null; });

if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  frame(END - 0.5);
} else {
  (function loop(n) {
    const d = last === null ? 0 : Math.min((n - last) / 1000, 0.05);
    last = n;
    clock += d;
    frame(clock % (END + FADE));
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
</html>
