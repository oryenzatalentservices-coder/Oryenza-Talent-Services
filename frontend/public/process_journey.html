<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oryenza 5-Stage Recruitment Journey Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Base Light Theme Tokens (Matches Oryenza Official Brand Identity) */
:root,
html[data-theme="light"] {
  --bg: #ffffff;
  --text: #0b192c;
  --num: #1565d8;
  --track: #dce6f3;
  --glow: #27b5ff;
  --beam: #1f6bff;
  --pulse: #00b8d9;
  --runner-bg: #ffffff;
  --runner-border: #1565d8;
  --bubble-bg: #ffffff;
  --bubble-border: #bfe3ff;
  --bubble-text: #0b192c;
  --bubble-shadow: 0 10px 28px rgba(11, 25, 44, 0.12);
}

/* Inside embedded light parent with .pale-section */
html.in-iframe[data-theme="light"] {
  --bg: #f4f7fb;
}

/* Dark Theme Tokens (Matches .pale-section #0a1a30 in dark mode) */
:root[data-theme="dark"],
html.oryenza-dark {
  --bg: #0a1a30;
  --text: #f1f5f9;
  --num: #38bdf8;
  --track: #1e3a5f;
  --glow: #38bdf8;
  --beam: #1565d8;
  --pulse: #38bdf8;
  --runner-bg: #0f172a;
  --runner-border: #38bdf8;
  --bubble-bg: #0f172a;
  --bubble-border: #334155;
  --bubble-text: #f1f5f9;
  --bubble-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
}

/* Print Mode: High-Contrast Clean White for Document/PDF Printouts */
@media print {
  html, body {
    background: #ffffff !important;
    color: #0b192c !important;
  }
  #num {
    color: #1565d8 !important;
  }
  #name {
    color: #0b192c !important;
  }
  #wrap {
    opacity: 1 !important;
  }
  #lab {
    opacity: 1 !important;
    transform: none !important;
  }
  #track-group {
    opacity: 0 !important;
  }
  #hd {
    opacity: 0 !important;
  }
  #tk {
    opacity: 1 !important;
    mask: none !important;
    -webkit-mask: none !important;
    transform: none !important;
  }
}

html.oryenza-dark #tk,
html[data-theme="dark"] #tk {
  filter: url(#logo-glow);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}

#wrap {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0;
  position: relative;
  transition: opacity 0.3s ease;
}

svg {
  width: min(90vw, 440px);
  height: auto;
  overflow: visible;
  display: block;
}

#lab {
  text-align: center;
  margin-top: 6px;
  min-height: 66px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.25s ease;
}

#num {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: clamp(30px, 4.8vw, 40px);
  color: var(--num);
  line-height: 1.1;
  letter-spacing: -0.02em;
  transition: color 0.3s ease;
}

#name {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: clamp(20px, 3.4vw, 26px);
  color: var(--text);
  letter-spacing: -0.01em;
  margin-top: 2px;
  transition: color 0.3s ease;
}
</style>
</head>
<body>
<div id="wrap">
  <!-- Tightened viewBox to eliminate dead margin padding -->
  <svg viewBox="-90 -60 880 750" role="img" aria-label="5 Stage Recruitment Process Journey Animation">
    <defs>
      <!-- Gradient for the journey track and official brand logo -->
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" y1="120" x2="660" y2="640">
        <stop offset="0" stop-color="#2BD8FF"/>
        <stop offset=".55" stop-color="#1F6BFF"/>
        <stop offset="1" stop-color="#0A2A78"/>
      </linearGradient>

      <!-- Soft neon glow for active pulse -->
      <filter id="b" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="16"/>
      </filter>

      <!-- Clean circular cut-out mask at top-right for arrow opening -->
      <mask id="c" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="900">
        <rect x="-100" y="-100" width="900" height="900" fill="#fff"/>
        <polygon points="350,351 744,43 665,-38 569,-98" fill="#000"/>
      </mask>

      <!-- Expanding mask revealing center brand mark at stage 06 -->
      <mask id="m" maskUnits="userSpaceOnUse" x="-100" y="-100" width="900" height="900">
        <circle id="mc" cx="350" cy="351" r="0" fill="#fff"/>
      </mask>

      <!-- Drop shadow for the speech bubble -->
      <filter id="bubble-shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.14"/>
      </filter>

      <!-- Cyan rim glow for dark mode logo clarity -->
      <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.4"/>
      </filter>
    </defs>

    {/* Circular Track and Dynamic Progress Arc */}
    <g id="track-group" mask="url(#c)">
      <circle cx="350" cy="351" r="280" fill="none" stroke="var(--track)" stroke-width="82"/>
      <g transform="rotate(-38 350 351)">
        <circle id="gl" cx="350" cy="351" r="280" fill="none" stroke="var(--glow)" stroke-width="82" pathLength="100" stroke-dasharray="0 100" filter="url(#b)" opacity=".55"/>
        <circle id="pr" cx="350" cy="351" r="280" fill="none" stroke="url(#g)" stroke-width="82" pathLength="100" stroke-dasharray="0 100"/>
      </g>
    </g>

    {/* Stage 06: Official Oryenza Brand Logo (Reveals seamlessly at completion) */}
    <g id="tk" mask="url(#m)" opacity="0">
      <image href="/assets/process_journey_logo.png" x="0" y="1" width="700" height="700"/>
    </g>

    {/* Stage 06: Cyan Shockwave Celebration Pulse */}
    <circle id="pu" cx="350" cy="351" r="280" fill="none" stroke="var(--pulse)" stroke-width="6" opacity="0"/>

    {/* Unified Single Traveler Runner & Speech Bubble (Zero Overlap, Perfect Alignment) */}
    <g id="hd" opacity="0">
      {/* Node Button Riding Directly in Center of Track at (630, 351) */}
      <circle cx="630" cy="351" r="34" fill="var(--runner-bg)" stroke="var(--runner-border)" stroke-width="4.5" filter="url(#bubble-shadow-filter)"/>
      <circle cx="630" cy="351" r="28" fill="var(--runner-bg)"/>

      {/* Counter-rotating Badge & Icon Group Pivoted Exactly at (630, 351) */}
      <g id="bd" opacity="0">
        {/* Crisp Speech Bubble with Pointer Tail Centered at X=630 */}
        <path
          d="M 504 238 h 252 a 14 14 0 0 1 14 14 v 24 a 14 14 0 0 1 -14 14 h -114 l -12 14 l -12 -14 h -126 a 14 14 0 0 1 -14 -14 v -24 a 14 14 0 0 1 14 -14 z"
          fill="var(--bubble-bg)"
          stroke="var(--bubble-border)"
          stroke-width="3"
          filter="url(#bubble-shadow-filter)"
        />

        {/* Badge Stage Title Text */}
        <text
          id="pt"
          x="630"
          y="273"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', system-ui, sans-serif"
          font-weight="700"
          font-size="22"
          fill="var(--bubble-text)"
        >
          01  Requirement Intake
        </text>

        {/* Stage Icons Centered Inside Runner Node (630, 351) */}
        {/* 01: Requirement Intake (Layers / Document) */}
        <g id="ic0" opacity="0" transform="translate(613.5, 334.5) scale(1.4)" fill="none" stroke="var(--num)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 3h7l4 4v14H7z M14 3v4h4 M9.5 12h6 M9.5 15.5h6 M9.5 9h2"/>
        </g>

        {/* 02: Active Sourcing (Search Magnifying Glass) */}
        <g id="ic1" opacity="0" transform="translate(613.5, 334.5) scale(1.4)" fill="none" stroke="var(--num)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6"/>
          <path d="M16 16l5 5"/>
        </g>

        {/* 03: Contextual Screening (Verified Check Assessment) */}
        <g id="ic2" opacity="0" transform="translate(613.5, 334.5) scale(1.4)" fill="none" stroke="var(--num)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="4" width="14" height="16" rx="2"/>
          <path d="M9 4V3h6v1 M8.5 12.5l2.5 2.5 5-5"/>
        </g>

        {/* 04: Interview Loop (Candidate & Interviewer Dialogue) */}
        <g id="ic3" opacity="0" transform="translate(613.5, 334.5) scale(1.4)" fill="none" stroke="var(--num)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4.5 21c0-4.5 3.5-7 7.5-7s7.5 2.5 7.5 7"/>
        </g>

        {/* 05: Offer & Onboarding (Award / Offer Letter) */}
        <g id="ic4" opacity="0" transform="translate(613.5, 334.5) scale(1.4)" fill="none" stroke="var(--num)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="6"/>
          <path d="M15.5 13.5L18 21l-6-3-6 3 2.5-7.5"/>
        </g>
      </g>
    </g>
  </svg>

  <!-- Live Dynamic Bottom Title & Number Displayed for ALL Steps (01 to 06) -->
  <div id="lab">
    <div id="num">01</div>
    <div id="name">Requirement Intake</div>
  </div>
</div>

<script>
// Live theme synchronization with parent document or standalone controls
function syncTheme() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const themeParam = urlParams.get('theme');
    
    let isDark = false;
    if (themeParam === 'dark') {
      isDark = true;
    } else if (themeParam === 'light') {
      isDark = false;
    } else if (window.parent && window.parent !== window && window.parent.document) {
      // Embedded inside parent application: strictly follow parent site state
      const parentDoc = window.parent.document.documentElement;
      isDark = parentDoc.classList.contains('oryenza-dark') || parentDoc.getAttribute('data-theme') === 'dark';
    } else {
      // Standalone direct preview: default to light brand theme unless localStorage specifies dark
      const local = localStorage.getItem('oryenza_theme');
      isDark = (local === 'dark');
    }

    const isInIframe = window.parent && window.parent !== window;
    if (isInIframe) {
      document.documentElement.classList.add('in-iframe');
    } else {
      document.documentElement.classList.remove('in-iframe');
    }

    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.documentElement.classList.add('oryenza-dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.classList.remove('oryenza-dark');
    }
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
}

syncTheme();

try {
  if (window.parent && window.parent !== window && window.parent.document) {
    const observer = new MutationObserver(syncTheme);
    observer.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
  }
} catch (e) {}

window.addEventListener('storage', syncTheme);

// Complete Stage Metadata for ALL Steps (01 to 06)
const STAGES = [
  { num: "01", name: "Requirement Intake" },
  { num: "02", name: "Active Sourcing" },
  { num: "03", name: "Contextual Screening" },
  { num: "04", name: "Interview Loop" },
  { num: "05", name: "Offer & Onboarding" },
  { num: "06", name: "Successful Joining" }
];

const POP = [
  "01  Requirement Intake",
  "02  Active Sourcing",
  "03  Contextual Screening",
  "04  Interview Loop",
  "05  Offer & Onboarding"
];

const CX = 350, CY = 351, MAXA = 334;
const L = [0.4, 3.0, 5.6, 8.2, 10.8, 13.4];
const DP = [1.0, 3.6, 6.2, 8.8, 11.4];
const T = 1.8;
const TR = 13.6; // Time when Stage 06 brand reveal starts
const TD = 1.2;  // Duration of reveal shockwave
const END = TR + TD + 3.8; // 18.6s total cycle (3.8s steady final brand display)
const FADE = 0.6; // Seamless loop fade duration

const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const cl = x => Math.max(0, Math.min(1, x));
const $ = id => document.getElementById(id);

function frame(t) {
  const tt = Math.min(t, END);
  let p = 0;
  for (let j = 0; j < 5; j++) {
    if (tt >= DP[j]) {
      p = (j + ease(cl((tt - DP[j]) / T))) / 5;
    }
  }

  // Progress arc strokes
  const da = `${(p * MAXA) / 3.6} 100`;
  $('pr').setAttribute('stroke-dasharray', da);
  $('gl').setAttribute('stroke-dasharray', da);

  // Runner angle & position
  const th = -38 + p * MAXA;
  $('hd').setAttribute('transform', `rotate(${th} ${CX} ${CY})`);

  // Counter-rotate badge around runner node center (630, 351) with zero offset
  $('bd').setAttribute('transform', `rotate(${-th} 630 ${CY})`);

  // Runner visibility:
  // Active during stages 01-05 (0.2s - 13.1s)
  // Cleanly fades out before Stage 06 logo reveal starts at TR (13.6s)
  let runnerOp = 0;
  if (tt < 0.2) {
    runnerOp = 0;
  } else if (tt < 0.45) {
    runnerOp = (tt - 0.2) / 0.25;
  } else if (tt < 13.1) {
    runnerOp = 1;
  } else if (tt < 13.45) {
    runnerOp = 1 - (tt - 13.1) / 0.35;
  } else {
    runnerOp = 0;
  }
  $('hd').setAttribute('opacity', runnerOp);

  // Active Stage Indicator and Speech Bubble
  let bo = 0, idx = 0;
  for (let j = 0; j < 5; j++) {
    const w = cl((tt - L[j]) / 0.25) * (1 - cl((tt - L[j + 1] + 0.25) / 0.25));
    if (w > 0) {
      bo = w;
      idx = j;
    }
    const ico = $('ic' + j);
    if (ico) ico.setAttribute('opacity', w);
  }
  $('pt').textContent = POP[idx];
  $('bd').setAttribute('opacity', bo);

  // Stage 06 Logo Presentation
  const v = cl((tt - TR) / TD);
  const ve = ease(v);

  // Mask circle expands to reveal the full authentic brand logo
  $('mc').setAttribute('r', ve * 550);

  // Gentle scale bloom & opacity on the brand logo
  $('tk').setAttribute('opacity', ve);
  $('tk').setAttribute('transform', `translate(${CX} ${CY}) scale(${0.92 + 0.08 * ve}) translate(${-CX} ${-CY})`);

  // Circular journey track smoothly crossfades out as the official logo blooms into full view
  $('track-group').setAttribute('opacity', 1 - ve);

  // Expanding celebration shockwave pulse ring
  $('pu').setAttribute('r', 280 + ve * 80);
  $('pu').setAttribute('opacity', v > 0 ? (1 - ve) * 0.8 : 0);

  // Active Stage Determination for ALL 6 Steps (01 to 06)
  let currentStage = 0;
  if (tt < L[1]) {
    currentStage = 0;
  } else if (tt < L[2]) {
    currentStage = 1;
  } else if (tt < L[3]) {
    currentStage = 2;
  } else if (tt < L[4]) {
    currentStage = 3;
  } else if (tt < TR) {
    currentStage = 4;
  } else {
    currentStage = 5;
  }

  // Update Dynamic Bottom Number & Title for ALL steps
  const stageData = STAGES[currentStage];
  if ($('num').textContent !== stageData.num) {
    $('num').textContent = stageData.num;
  }
  if ($('name').textContent !== stageData.name) {
    $('name').textContent = stageData.name;
  }

  // Bottom Label Visibility: Fades in smoothly at start and stays visible for ALL steps
  const labOp = Math.min(cl((tt - 0.1) / 0.25), cl((END + FADE - t) / FADE));
  $('lab').style.opacity = labOp;

  // Seamless loop fade
  $('wrap').style.opacity = Math.min(cl(t / 0.3), cl((END + FADE - t) / FADE));
}

let clock = 0, last = null;
document.addEventListener('visibilitychange', () => { last = null; });

window.addEventListener('beforeprint', () => {
  frame(16.0);
});

const urlP = new URLSearchParams(window.location.search);
const fixedT = urlP.has('t') ? parseFloat(urlP.get('t')) : null;

if (fixedT !== null) {
  frame(fixedT);
} else if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  frame(END - 0.5);
} else {
  (function loop(n) {
    if (last !== null) {
      const dt = (n - last) / 1000;
      if (dt < 0.2) clock += dt;
    }
    last = n;
    if (clock >= END + FADE) clock = 0;
    frame(clock);
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>
</body>
</html>
